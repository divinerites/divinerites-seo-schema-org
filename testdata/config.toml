baseURL = "https://example.org/"
title = "Example practice"
defaultContentLanguage = "en"

[languages.en]
  locale = "en"

[params]
  typeseo = "localbusiness"
  home = "Home"

  [params.seo_schema]
    breadcrumb = true
    inherit_site_types = true

  [params.seo_json]
    social_facebook = "schema.facebook"
    social_twitter = "schema.twitter"
    defaultKeywords = "schema.keywords"
    officeAddress = "schema.address"
    officeAddressVille = "schema.city"
    officeAddressRegion = "schema.region"
    officeAddressCP = "schema.postalCode"
    officeAddressPays = "schema.country"
    officePhones = ["data.contact.phone1", "data.contact.phone2"]
    officeHorairesJours = "schema.weekdays"
    officeHorairesOpen = "schema.weekdayOpen"
    officeHorairesClose = "schema.weekdayClose"
    officeHorairesJoursWE = "schema.weekendDays"
    officeHorairesOpenWE = "schema.weekendOpen"
    officeHorairesCloseWE = "schema.weekendClose"
    priceAmount = "data.contact.tarifMontant"
    priceCurrencySymbol = "data.contact.tarifSymbole"
    personGivenName = "data.contact.first_name"
    personFamilyName = "data.contact.last_name"
    personJobTitle = "schema.personJobTitle"

  [params.schema]
    facebook = "https://www.facebook.com/example"
    twitter = "https://twitter.com/example"
    keywords = ["practice", "example"]
    address = "1 Example Street"
    city = "Example City"
    region = "Example Region"
    postalCode = "12345"
    country = "FR"
    weekdays = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"]
    weekdayOpen = "08:30"
    weekdayClose = "19:00"
    weekendDays = ["Saturday"]
    weekendOpen = "08:30"
    weekendClose = "12:00"
    personJobTitle = "Practitioner"
